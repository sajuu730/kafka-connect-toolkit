name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kct_test
          POSTGRES_USER: kct_test
          POSTGRES_PASSWORD: kct_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kct_test -d kct_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      KCT_POSTGRES_TEST_URL: jdbc:postgresql://localhost:5432/kct_test
      KCT_POSTGRES_TEST_USER: kct_test
      KCT_POSTGRES_TEST_PASSWORD: kct_test_password
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify
        run: mvn --batch-mode --no-transfer-progress verify
