name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kct_test
          POSTGRES_USER: kct_test
          POSTGRES_PASSWORD: kct_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kct_test -d kct_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      KCT_POSTGRES_TEST_URL: jdbc:postgresql://localhost:5432/kct_test
      KCT_POSTGRES_TEST_USER: kct_test
      KCT_POSTGRES_TEST_PASSWORD: kct_test_password
      DOCKER_HOST: unix:///var/run/docker.sock
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify Docker is available for Testcontainers
        run: docker info
      - name: Verify
        run: mvn --batch-mode --no-transfer-progress verify

  end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build connector plugins
        run: mvn --batch-mode --no-transfer-progress -DskipTests package
      - name: Validate E2E smoke-test shell syntax
        run: bash -n scripts/e2e-smoke.sh
      - name: Start Kafka, Schema Registry, Connect, MySQL and monitoring
        run: docker compose up -d
      - name: Exercise delivery, DLQ, rebalances, recovery and monitoring
        run: bash scripts/e2e-smoke.sh
      - name: Collect container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop integration stack
        if: always()
        run: docker compose down -v
