startDelaySeconds: 5
hostPort: connect:9999
username:
password:
rules:
  - pattern: 'io.github.sajuu730.connect<.*type=ConnectorTask.*><>RecordsProcessed'
    name: kct_records_processed_total
    type: COUNTER
  - pattern: 'io.github.sajuu730.connect<.*type=ConnectorTask.*><>BatchesCompleted'
    name: kct_batches_completed_total
    labels:
      connector: "$1"
      instance: "$2"
    type: COUNTER
  - pattern: 'io.github.sajuu730.connect<.*type=ConnectorTask.*><>Requests'
    name: kct_http_requests_total
    labels:
      connector: "$1"
      instance: "$2"
    type: COUNTER
  - pattern: 'io.github.sajuu730.connect<.*type=ConnectorTask.*><>Retries'
    name: kct_retries_total
    labels:
      connector: "$1"
      instance: "$2"
    type: COUNTER
  - pattern: 'io.github.sajuu730.connect<.*type=ConnectorTask.*><>Failures'
    name: kct_failures_total
    labels:
      connector: "$1"
      instance: "$2"
    type: COUNTER
  - pattern: 'io.github.sajuu730.connect<.*type=ConnectorTask.*><>DlqRecordsRouted'
    name: kct_dlq_records_routed_total
    labels:
      connector: "$1"
      instance: "$2"
    type: COUNTER
  - pattern: 'io.github.sajuu730.connect<.*type=ConnectorTask.*><>LastSuccessTimeEpochMs'
    name: kct_last_success_time_epoch_ms
    labels:
      connector: "$1"
      instance: "$2"
    type: GAUGE
  - pattern: 'kafka.connect<type=connector-task-metrics, connector=(.+), task=(.+)><>(.+)'
    name: kafka_connect_connector_task_$3
    labels:
      connector: "$1"
      task: "$2"
  - pattern: 'kafka.connect<type=connect-worker-metrics><>(.+)'
    name: kafka_connect_worker_$1
  - pattern: '.*'
